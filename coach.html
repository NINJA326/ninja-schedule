<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>NINJA AIRS 練習予定表 コーチ専用</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root{
      --bg:#07111f;--panel:#0f1d31;--panel2:#14263e;--line:#29415f;
      --text:#f8fafc;--muted:#a9b8cb;--primary:#2563eb;--danger:#dc2626;
      --ok:#16a34a;--shadow:0 14px 35px rgba(0,0,0,.30);
      --header-h:116px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}
    button{touch-action:manipulation}
    .hidden{display:none!important}
    .app{height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
    .top{flex:0 0 auto;background:rgba(7,17,31,.97);padding:8px 4px 6px;border-bottom:1px solid rgba(41,65,95,.55)}
    .toprow{display:flex;align-items:center;gap:8px;justify-content:space-between}
    .brand h1{font-size:17px;margin:0;white-space:nowrap;font-weight:700}.brand small{display:none}
    .actions{display:flex;gap:5px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:7px 9px;font-weight:650;cursor:pointer;min-height:36px}
    .btn.primary{background:var(--primary);border-color:var(--primary)}.btn.danger{background:var(--danger);border-color:var(--danger)}.btn.ghost{background:transparent}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .toolbar{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;padding:7px 2px 5px}
    .toolbar h2{text-align:center;margin:0;font-size:18px;font-weight:700}.navs{display:flex;gap:4px}
    .status{flex:0 0 auto;min-height:18px;color:var(--muted);font-size:11px;padding:0 4px 4px}.status.error{color:#fecaca}.status.ok{color:#bbf7d0}
    .calendar-wrap{flex:1 1 auto;min-height:0;overflow:hidden}
    .calendar{height:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:28px repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
    .dow{display:grid;place-items:center;font-size:11px;font-weight:700;background:#0a1627;border-right:1px solid var(--line)}
    .dow:nth-child(7){border-right:0}.dow.sun{color:#fca5a5}.dow.sat{color:#93c5fd}
    .day{position:relative;min-width:0;min-height:0;padding:2px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel);overflow:hidden}
    .day:nth-child(7n){border-right:0}.day.out{opacity:.35}.day.today{box-shadow:inset 0 0 0 1px rgba(96,165,250,.75)}.day.selected{background:#183150;box-shadow:inset 0 0 0 2px #f8fafc,0 0 14px rgba(96,165,250,.35);z-index:2}
    .dayhead{height:16px;display:flex;justify-content:space-between;align-items:center}.daynum{font-size:10px;font-weight:700}.addmini{border:0;background:transparent;color:#93c5fd;font-size:14px;line-height:1;padding:0 1px;cursor:pointer}
    .event{display:block;width:100%;border:0;border-radius:4px;color:#fff;padding:2px 3px;margin:2px 0;cursor:pointer;text-align:left;overflow:hidden;line-height:1.08;box-shadow:0 1px 2px rgba(0,0,0,.18)}
    .event .cats,.event .kind{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event .cats{font-size:8px;font-weight:600}.event .kind{font-size:9px;font-weight:700;margin-top:1px}.compact-event{padding:1px 3px;margin:1px 0;min-height:14px}.compact-event .kind{font-size:8px;line-height:1.12;margin:0}
    .more{font-size:8px;color:#cbd5e1;padding-left:2px}
    .login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
    .loginbox h1{margin:0 0 6px}.loginbox p{color:var(--muted);margin:0 0 18px}
    .field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#071425;color:var(--text);border-radius:9px;padding:10px 11px;min-height:42px}
    .field textarea{min-height:82px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:none;padding:0;overflow:hidden}.modal.open{display:flex;align-items:flex-end;justify-content:center}
    .dialog{width:min(680px,100%);max-height:94dvh;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
    .dialoghead{flex:0 0 auto;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialoghead h3{margin:0;font-size:17px}
    .close{border:0;background:transparent;color:white;font-size:26px;cursor:pointer}
    .dialogbody{flex:1 1 auto;overflow:auto;padding:13px 15px}
    .dialogfoot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:7px;flex-wrap:wrap;background:var(--panel)}
    .dialogfoot .spacer{flex:1}.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:14px}.detail-grid dt{color:var(--muted);font-weight:800}.detail-grid dd{margin:0;white-space:pre-wrap;word-break:break-word}
    .category-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.category-choice{display:flex;align-items:center;gap:7px;background:#09182a;border:1px solid var(--line);border-radius:9px;padding:9px}
    .type-palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.type-choice{border:2px solid transparent;border-radius:9px;min-height:46px;color:#fff;font-size:11px;font-weight:900;padding:5px;cursor:pointer}.type-choice.selected{border-color:#fff;box-shadow:0 0 0 2px #2563eb}
    .attachment-list{display:grid;gap:8px;margin-top:8px}.attachment{display:flex;align-items:center;gap:8px;background:#09182a;border:1px solid var(--line);border-radius:9px;padding:8px}
    .attachment-thumb{width:48px;height:48px;border-radius:7px;object-fit:cover;background:#13243b}.attachment-info{min-width:0;flex:1}.attachment-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-meta{font-size:10px;color:var(--muted)}
    .attachment a{color:#93c5fd;text-decoration:none;font-size:12px;font-weight:800}.upload-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.upload-row input[type=file]{max-width:100%;font-size:12px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:#020617;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}

    .role-badge{font-size:11px;color:#bfdbfe;white-space:nowrap}.build-badge{font-size:10px;color:#94a3b8;margin-top:2px}
    .attendance-card{margin-top:14px;border:1px solid var(--line);background:#09182a;border-radius:12px;padding:12px}
    .attendance-card h4{margin:0 0 8px;font-size:15px}
    .attendance-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .attendance-buttons button.selected{outline:2px solid #fff}
    .attendance-reason{margin-top:10px}
    .summary-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
    .summary-count{background:#13243b;border-radius:8px;padding:8px 4px;text-align:center;font-size:11px}
    .summary-count strong{display:block;font-size:18px}
    .attendance-row{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
    .attendance-roster{display:grid;gap:7px;margin-top:10px}
    .attendance-person{border:1px solid var(--line);border-radius:10px;background:#0d1b2e;overflow:hidden}
    .attendance-person-main{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);padding:10px 11px;text-align:left;cursor:default}
    .attendance-person-main.expandable{cursor:pointer}
    .attendance-person-name{min-width:0;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .attendance-person-category{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:600}
    .attendance-status-pill{min-width:58px;text-align:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}
    .attendance-status-pill.present{background:#14532d;color:#bbf7d0}
    .attendance-status-pill.late{background:#713f12;color:#fde68a}
    .attendance-status-pill.absent{background:#7f1d1d;color:#fecaca}
    .attendance-status-pill.unanswered{background:#334155;color:#e2e8f0}
    .attendance-chevron{width:18px;color:var(--muted);font-size:13px;text-align:center}
    .attendance-person-detail{display:none;border-top:1px solid var(--line);padding:10px 12px;background:#09182a;font-size:12px;line-height:1.7}
    .attendance-person.open .attendance-person-detail{display:block}
    .attendance-detail-label{color:var(--muted);font-weight:800;margin-right:6px}
    .category-filter{min-width:118px;max-width:160px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:7px 8px;min-height:36px;font-weight:700}
    .color-picker-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .color-picker-wrap input[type=color]{width:58px;height:44px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#071425;cursor:pointer}
    .color-presets{display:flex;gap:7px;flex-wrap:wrap}
    .color-preset{width:36px;height:36px;border-radius:9px;border:2px solid transparent;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
    .color-preset.selected{border-color:#fff;box-shadow:0 0 0 2px #2563eb}
    .category-box .category-choice{padding:6px 7px;min-height:34px;font-size:11px;gap:5px}
    .category-box .category-choice input{width:16px;height:16px;margin:0}
    .day-list{display:grid;gap:10px}
    .day-list-item{width:100%;border:1px solid var(--line);border-left:8px solid var(--primary);background:#09182a;color:var(--text);border-radius:12px;padding:12px;text-align:left;cursor:pointer;min-height:76px}
    .day-list-item strong{display:block;font-size:15px;margin-bottom:5px}
    .day-list-meta{font-size:12px;color:var(--muted);line-height:1.5}
    .attendance-badge{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:999px;background:#f8fafc;color:#0f172a;font-size:8px;font-weight:900}
    .day.has-events{cursor:pointer}
    @media(min-width:761px){
      .app{width:min(1180px,100%);margin:auto;padding-left:10px;padding-right:10px}.brand h1{font-size:20px}.brand small{display:block;color:var(--muted)}
      .event .cats{font-size:10px}.event .kind{font-size:11px}.daynum{font-size:12px}.calendar{grid-template-rows:32px repeat(6,minmax(0,1fr))}
      .dialog{border-radius:18px;margin-bottom:3dvh}.modal.open{align-items:center}.category-box{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
  </style>
  <script src="./config.js?v=9.5.0"></script>
</head>
<body>
  <section id="loginView" class="login">
    <div class="loginbox">
      <h1>NINJA AIRS</h1><p>練習予定表・コーチ専用</p>
      <div class="field"><label for="apiUrl">Apps Script WebアプリURL</label><input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="field"><label for="password">パスワード</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password"></div>
      <button id="loginBtn" class="btn primary" style="width:100%">ログイン</button>
      <div id="lineLoginStatus" class="status">LINE認証を確認しています…</div>
      <div id="loginStatus" class="status"></div>
    </div>
  </section>

  <main id="appView" class="app hidden">
    <header class="top">
      <div class="toprow">
        <div class="brand"><h1>NINJA AIRS 練習予定表</h1><small>予定・出欠管理アプリ コーチ専用</small><div id="roleBadge" class="role-badge"></div><div class="build-badge">build v9.6-coach</div></div>
        <div class="actions">
          <button id="newBtn" class="btn primary">＋追加</button>
          <button id="sheetBtn" class="btn ghost">読込</button>
          <button id="logoutBtn" class="btn ghost">退出</button>
        </div>
      </div>
    </header>
    <div class="toolbar">
      <div class="navs"><button id="prevBtn" class="btn">‹</button><button id="todayBtn" class="btn">今日</button></div>
      <h2 id="monthTitle">--</h2>
      <div class="navs">
        <select id="categoryFilter" class="category-filter" aria-label="表示カテゴリー">
          <option value="ALL">全カテゴリー</option>
          <option value="U13男子">男子U13</option>
          <option value="U14男子">男子U14</option>
          <option value="U15男子">男子U15</option>
          <option value="U13女子">女子U13</option>
          <option value="U14女子">女子U14</option>
          <option value="U15女子">女子U15</option>
        </select>
        <button id="nextBtn" class="btn">›</button>
      </div>
    </div>
    <div id="status" class="status"></div>
    <div class="calendar-wrap"><section id="calendar" class="calendar" aria-label="月間カレンダー"></section></div>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <section class="dialog">
      <div class="dialoghead"><h3 id="modalTitle">予定詳細</h3><button type="button" id="closeBtn" class="close">×</button></div>
      <div id="detailView" class="dialogbody"></div>
      <form id="eventForm" class="dialogbody hidden">
        <input id="scheduleId" type="hidden"><input id="sourceRef" type="hidden">
        <div class="grid2">
          <div class="field"><label>日付 *</label><input id="date" type="date" required></div>
          <div class="field"><label>予定種類 *</label><select id="type"></select></div>
        </div>
        <div class="field"><label>対象カテゴリー *</label><div id="categoryChoices" class="category-box"></div></div>
        <div class="field">
          <label>予定の色 *</label>
          <div class="color-picker-wrap">
            <input id="eventColor" type="color" value="#2563eb" aria-label="予定の色">
            <div id="colorPresets" class="color-presets"></div>
          </div>
        </div>
        <div class="field"><label>予定名</label><input id="title" placeholder="例：合同練習"></div>
        <div class="field"><label>会場</label><input id="location" placeholder="例：龍谷大学瀬田キャンパス体育館"></div>
        <label class="category-choice" style="width:max-content"><input id="allDay" type="checkbox">終日</label>
        <div id="timeFields" class="grid2"><div class="field"><label>開始</label><input id="startTime" type="time"></div><div class="field"><label>終了</label><input id="endTime" type="time"></div></div>
        <div class="field"><label>詳細</label><textarea id="note" placeholder="集合時間、持ち物、対戦相手、連絡事項など"></textarea></div>
        <div class="attendance-card">
          <label class="category-choice" style="width:max-content"><input id="attendanceEnabled" type="checkbox">出欠回答を必須にする</label>
          <div id="deadlineFields" class="grid2 hidden">
            <div class="field"><label>回答期限日</label><input id="deadlineDate" type="date"></div>
            <div class="field"><label>締切時刻</label><input id="deadlineTime" type="time" value="21:00"></div>
          </div>
        </div>
        <div id="modalStatus" class="status"></div>
      </form>
      <div id="detailFoot" class="dialogfoot">
        <button type="button" id="editBtn" class="btn primary">変更</button>
        <button type="button" id="copyBtn" class="btn">複写</button>
        <button type="button" id="deleteBtn" class="btn danger">削除</button>
        <span class="spacer"></span>
        <button type="button" id="closeDetailBtn" class="btn">閉じる</button>
      </div>
      <div id="editFoot" class="dialogfoot hidden">
        <button type="button" id="cancelEditBtn" class="btn">取消</button>
        <span class="spacer"></span>
        <button type="button" id="saveBtn" class="btn primary">保存</button>
      </div>
    </section>
  </div>
  <div id="dayListModal" class="modal" aria-hidden="true">
    <section class="dialog">
      <div class="dialoghead"><h3 id="dayListTitle">1日の予定</h3><button type="button" id="dayListClose" class="close">×</button></div>
      <div id="dayListBody" class="dialogbody day-list"></div>
      <div class="dialogfoot"><span class="spacer"></span><button type="button" id="dayListCloseBtn" class="btn">閉じる</button></div>
    </section>
  </div>
  <div id="toast" class="toast"></div>

<script>
'use strict';

const BASE_CATEGORIES=[
  {value:'U13男子',label:'男子U13'},
  {value:'U14男子',label:'男子U14'},
  {value:'U15男子',label:'男子U15'},
  {value:'U13女子',label:'女子U13'},
  {value:'U14女子',label:'女子U14'},
  {value:'U15女子',label:'女子U15'}
];
const CATEGORY_GROUPS=[
  {value:'男子全員',label:'男子全員',members:['U13男子','U14男子','U15男子']},
  {value:'女子全員',label:'女子全員',members:['U13女子','U14女子','U15女子']},
  {value:'全体',label:'全体',members:BASE_CATEGORIES.map(x=>x.value)}
];
const CATEGORIES=[...BASE_CATEGORIES,...CATEGORY_GROUPS];
const COLOR_PRESETS=['#2563eb','#dc2626','#16a34a','#eab308','#7c3aed','#ea580c','#0891b2','#db2777','#6b7280','#92400e'];
const TYPES=[
  {name:'練習',color:'#2563eb'},
  {name:'試合',color:'#dc2626'},
  {name:'遠征',color:'#16a34a'},
  {name:'イベント',color:'#eab308'},
  {name:'ミーティング',color:'#7c3aed'},
  {name:'特別練習',color:'#ea580c'},
  {name:'シューティング',color:'#0891b2'},
  {name:'女子',color:'#db2777'},
  {name:'OFF',color:'#6b7280'},
  {name:'その他',color:'#92400e'}
];

const state={
  apiUrl:(window.NINJA_SCHEDULE_CONFIG&&window.NINJA_SCHEDULE_CONFIG.API_URL)||localStorage.getItem('scheduleApiUrl')||'',
  token:sessionStorage.getItem('scheduleToken')||'',
  role:sessionStorage.getItem('scheduleRole')||'',
  player:null,liffId:'',
  month:'',
  events:[],
  sourceUrl:'',
  currentEvent:null,
  selectedDate:'',
  categoryFilter:'ALL',
  growthPlayerName:'',
  growthRecord:null,
  mode:'detail',
  loadingMonth:false,
  dataVersion:''
};
const $=id=>document.getElementById(id);
const el={
  loginView:$('loginView'),appView:$('appView'),apiUrl:$('apiUrl'),password:$('password'),
  loginBtn:$('loginBtn'),loginStatus:$('loginStatus'),calendar:$('calendar'),monthTitle:$('monthTitle'),
  status:$('status'),modal:$('modal'),detailView:$('detailView'),form:$('eventForm'),
  detailFoot:$('detailFoot'),editFoot:$('editFoot'),modalStatus:$('modalStatus')
};

function jsonp(action,params={},timeoutMs=25000){
  return new Promise((resolve,reject)=>{
    if(!state.apiUrl||state.apiUrl.indexOf('ここにApps Script')===0)return reject(new Error('Apps Script URLを入力してください。'));
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>finish(new Error('通信がタイムアウトしました。')),timeoutMs);
    function finish(err,data){
      clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data);
    }
    window[cb]=data=>finish(null,data);
    const query=new URLSearchParams({...params,action,callback:cb,_:Date.now()});
    script.onerror=()=>finish(new Error('Apps Scriptへ接続できません。'));
    script.src=state.apiUrl+(state.apiUrl.includes('?')?'&':'?')+query.toString();
    document.body.appendChild(script);
  });
}
function assertOk(res){if(!res||res.status!=='ok')throw new Error(res&&res.message?res.message:'処理に失敗しました。');return res}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function showStatus(target,msg,type=''){target.textContent=msg||'';target.className='status'+(type?' '+type:'')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function persistSession(token,role='coach',player=null){
  state.token=String(token||'');
  state.role=String(role||'coach');
  state.player=player||null;
  if(state.token){sessionStorage.setItem('scheduleToken',state.token);sessionStorage.setItem('scheduleRole',state.role);}else{sessionStorage.removeItem('scheduleToken');sessionStorage.removeItem('scheduleRole');}
}
function clearSession(){persistSession('','',null)}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function localDateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayKey(){return localDateKey(new Date())}
function typeDef(name){return TYPES.find(x=>x.name===name)||TYPES[0]}
function normalizeHexColor(value){
  const color=String(value||'').trim();
  return /^#[0-9a-fA-F]{6}$/.test(color)?color:'#2563eb';
}

async function saveAttendance(status){
  const button=$('saveAttendanceBtn');
  try{
    if(!state.currentEvent||!state.currentEvent.scheduleId)throw new Error('予定情報を確認できません。月を再読み込みしてください。');
    const arrival=$('arrivalTime')?.value||'';
    const reason=$('attendanceReason')?.value.trim()||'';
    if(status==='遅刻'&&!arrival)throw new Error('到着予定時刻を入力してください。');
    if((status==='遅刻'||status==='欠席')&&!reason)throw new Error(status+'理由を入力してください。');
    if(button)button.disabled=true;
    showStatus($('attendanceStatus'),'登録中…');
    const res=assertOk(await jsonp('saveAttendance',{
      token:state.token,
      scheduleId:String(state.currentEvent.scheduleId),
      status,
      arrivalTime:arrival,
      reason
    },45000));
    if(!res.attendance)throw new Error('登録結果を確認できませんでした。');
    state.currentEvent={...state.currentEvent,myAttendance:res.attendance};
    saveEventToLocalMonths(state.currentEvent);
    renderDetail(state.currentEvent);
    toast('出欠を登録しました。');
  }catch(e){
    const target=$('attendanceStatus');
    if(target)showStatus(target,e.message,'error');
    else toast(e.message);
  }finally{
    if(button&&document.body.contains(button))button.disabled=false;
  }
}

function formatBytes(n){n=Number(n)||0;if(n<1024)return n+'B';if(n<1048576)return (n/1024).toFixed(1)+'KB';return (n/1048576).toFixed(1)+'MB'}
function pickGrowthValue(record,keys){for(const key of keys){const value=record?.[key];if(value!==undefined&&value!==null&&String(value).trim()!=='')return value;}return ''}
function normalizeGrowthRecord(res){
  const payload=res?.record||res?.growthRecord||res?.data||res;
  if(!payload||typeof payload!=='object')return null;
  const record=Array.isArray(payload)?payload[0]:payload;
  if(!record||typeof record!=='object')return null;
  return {
    shooting:pickGrowthValue(record,['shooting','shoot','shot','shotting','shootingScore']),
    height:pickGrowthValue(record,['height','heightCm','height_cm','heightInCm']),
    weight:pickGrowthValue(record,['weight','weightKg','weight_kg','bodyWeight']),
    agility:pickGrowthValue(record,['agility','agilityScore','agilityTime','agilitySec'])
  };
}
function renderGrowthRecordCard(record,errorMsg=''){
  if(errorMsg){return `<div class="attendance-card"><h4>成長記録</h4><div class="status error">${esc(errorMsg)}</div></div>`;}
  if(!record){return `<div class="attendance-card"><h4>成長記録</h4><div class="status">選手名を入力して表示してください。</div></div>`;}
  const items=[
    ['シュート',record.shooting],
    ['身長',record.height],
    ['体重',record.weight],
    ['敏捷性',record.agility]
  ].filter(([,value])=>value!=='' && value!==undefined && value!==null);
  if(!items.length){return `<div class="attendance-card"><h4>成長記録</h4><div class="status">成長記録データが見つかりませんでした。</div></div>`;}
  return `<div class="attendance-card"><h4>成長記録</h4><div class="summary-counts">${items.map(([label,value])=>`<div class="summary-count"><strong>${esc(String(value))}</strong>${esc(label)}</div>`).join('')}</div></div>`;
}
async function loadGrowthRecord(playerName){
  const name=(playerName||'').trim();
  const status=$('growthRecordStatus');
  const card=$('growthRecordCard');
  if(!name){showStatus(status,'選手名を入力してください。','error');card.innerHTML=renderGrowthRecordCard(null);return;}
  state.growthPlayerName=name;
  showStatus(status,'成長記録を読み込んでいます…');
  card.innerHTML=renderGrowthRecordCard(null);
  try{
    const candidates=[
      {action:'growthRecord',params:{playerName:name}},
      {action:'growthRecord',params:{player:name}},
      {action:'growthRecord',params:{name}},
      {action:'getGrowthRecord',params:{playerName:name}},
      {action:'getGrowthRecord',params:{player:name}},
      {action:'growthRecords',params:{playerName:name}},
      {action:'growthRecords',params:{player:name}}
    ];
    let lastError=null;
    let res=null;
    for(const candidate of candidates){
      try{
        res=assertOk(await jsonp(candidate.action,{token:state.token,...candidate.params},45000));
        break;
      }catch(e){lastError=e;}
    }
    if(!res)throw lastError||new Error('成長記録APIに接続できませんでした。');
    const record=normalizeGrowthRecord(res);
    if(!record)throw new Error('成長記録データを取得できませんでした。');
    state.growthRecord=record;
    card.innerHTML=renderGrowthRecordCard(record);
    showStatus(status,'成長記録を表示しました。','ok');
  }catch(e){
    state.growthRecord=null;
    card.innerHTML=renderGrowthRecordCard(null,e.message);
    showStatus(status,e.message,'error');
  }
}

function monthCacheKey(month){return 'ninjaScheduleMonthV9_5:'+month}
function readMonthCache(month){
  try{
    const raw=localStorage.getItem(monthCacheKey(month));
    if(!raw)return null;
    const data=JSON.parse(raw);
    return data&&Array.isArray(data.events)?data:null;
  }catch(e){return null}
}
function writeMonthCache(month,events,sourceUrl=''){
  try{localStorage.setItem(monthCacheKey(month),JSON.stringify({savedAt:Date.now(),events,sourceUrl:sourceUrl||''}))}catch(e){}
}
function sortEvents(events){
  return [...events].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.startTime||'').localeCompare(b.startTime||'')||(a.title||'').localeCompare(b.title||''));
}
function removeEventFromAllLocalMonths(scheduleId){
  if(!scheduleId)return;
  for(let i=localStorage.length-1;i>=0;i--){
    const key=localStorage.key(i)||'';
    if(!key.startsWith('ninjaScheduleMonthV9_5:'))continue;
    try{
      const data=JSON.parse(localStorage.getItem(key)||'{}');
      if(!Array.isArray(data.events))continue;
      const next=data.events.filter(e=>e.scheduleId!==scheduleId);
      if(next.length!==data.events.length){data.events=next;data.savedAt=Date.now();localStorage.setItem(key,JSON.stringify(data));}
    }catch(e){}
  }
}
function saveEventToLocalMonths(event){
  if(!event||!event.scheduleId||!event.date)return;
  removeEventFromAllLocalMonths(event.scheduleId);
  const month=event.date.slice(0,7);
  const cached=readMonthCache(month)||{events:[],sourceUrl:''};
  cached.events=sortEvents([...(cached.events||[]),event]);
  writeMonthCache(month,cached.events,cached.sourceUrl||'');
  if(state.month===month){state.events=cached.events;state.sourceUrl=cached.sourceUrl||'';renderCalendar();}
}
function removeLocalEvent(scheduleId){
  removeEventFromAllLocalMonths(scheduleId);
  state.events=state.events.filter(x=>x.scheduleId!==scheduleId);
  writeMonthCache(state.month,state.events,state.sourceUrl);
  renderCalendar();
}
async function loadMonth(month,{force=false}={}){
  state.month=month;
  const cached=readMonthCache(month);
  state.events=cached&&Array.isArray(cached.events)?cached.events:[];
  state.sourceUrl=cached?.sourceUrl||'';
  renderCalendar();

  if(cached&&!force){
    showStatus(el.status,`${month.replace('-','.')} を端末保存データから表示しています。`,'ok');
    return;
  }

  await fetchMonthOnce(month,{manual:force});
}
async function fetchMonthOnce(month,{manual=false}={}){
  if(state.loadingMonth)return;
  state.loadingMonth=true;
  if($('sheetBtn'))$('sheetBtn').disabled=true;
  showStatus(el.status,manual?'現在の月を読み込んでいます…':'初回データを読み込んでいます…');
  try{
    const res=assertOk(await jsonp('events',{token:state.token,month},25000));
    if(state.month!==month)return;
    state.events=sortEvents(res.events||[]);
    state.sourceUrl=res.sourceUrl||'';
    writeMonthCache(month,state.events,state.sourceUrl);
    renderCalendar();
    showStatus(el.status,`${month.replace('-','.')} を読み込みました。`,'ok');
    if(manual)toast('予定を読み込みました。');
  }catch(e){
    const existing=readMonthCache(month);
    if(existing){
      showStatus(el.status,`${month.replace('-','.')} を端末保存データから表示しています。`,'ok');
    }else{
      showStatus(el.status,e.message,'error');
    }
    if(/ログイン/.test(e.message))logout(false);
  }finally{
    state.loadingMonth=false;
    if($('sheetBtn'))$('sheetBtn').disabled=false;
  }
}
async function manualRefreshMonth(){
  const month=state.month||monthKey(new Date());
  await loadMonth(month,{force:true});
}

function filteredEventsForDate(date){
  return state.events.filter(e=>e.date===date&&(state.categoryFilter==='ALL'||parseCategories(e.categories||e.category).includes(state.categoryFilter)));
}
function openDayList(date){
  const events=filteredEventsForDate(date);
  if(!events.length){
    if(state.role==='coach')newEvent(date);
    return;
  }
  const d=new Date(date+'T00:00:00');
  $('dayListTitle').textContent=`${d.getMonth()+1}月${d.getDate()}日の予定（${events.length}件）`;
  $('dayListBody').innerHTML=events.map(e=>{
    const time=e.allDay?'終日':[e.startTime,e.endTime].filter(Boolean).join('〜')||'時間未設定';
    const name=e.title||e.type||'予定';
    const att=e.attendanceEnabled?'<span class="attendance-badge">出欠</span>':'';
    return `<button type="button" class="day-list-item" style="border-left-color:${esc(e.color||typeDef(e.type).color)}" data-day-event="${esc(e.scheduleId)}"><strong>${esc(name)}${att}</strong><div class="day-list-meta">${esc(categoriesText(e))}<br>${esc(time)}${e.location?'／'+esc(e.location):''}</div></button>`;
  }).join('');
  $('dayListBody').querySelectorAll('[data-day-event]').forEach(b=>b.onclick=async()=>{closeDayList();await openEvent(b.dataset.dayEvent)});
  $('dayListModal').classList.add('open');
  $('dayListModal').setAttribute('aria-hidden','false');
}
function closeDayList(){
  $('dayListModal').classList.remove('open');
  $('dayListModal').setAttribute('aria-hidden','true');
}
function renderCalendar(){
  const [y,m]=state.month.split('-').map(Number);
  el.monthTitle.textContent=`${y}年${String(m).padStart(2,'0')}月`;
  const first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay());
  let html=['日','月','火','水','木','金','土'].map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const key=monthKey(d),date=localDateKey(d);
    const events=filteredEventsForDate(date);
    html+=`<div class="day ${key!==state.month?'out':''} ${date===todayKey()?'today':''} ${date===state.selectedDate?'selected':''} ${events.length?'has-events':''}" data-date="${date}">
      <div class="dayhead"><span class="daynum">${d.getDate()}</span>${state.role==='coach'?`<button class="addmini" data-add="${date}" aria-label="予定追加">＋</button>`:''}</div>
      ${events.slice(0,4).map(e=>`<button class="event compact-event" style="background:${esc(e.color||typeDef(e.type).color)}" data-id="${esc(e.scheduleId)}" title="${esc(compactEventLabel(e))}">
        <span class="kind">${esc(compactEventLabel(e))}${e.attendanceEnabled?'<span class="attendance-badge">出欠</span>':''}</span></button>`).join('')}
      ${events.length>4?`<div class="more">＋${events.length-4}件</div>`:''}
    </div>`;
  }
  el.calendar.innerHTML=html;
  el.calendar.querySelectorAll('.day').forEach(cell=>cell.addEventListener('click',()=>{
    state.selectedDate=cell.dataset.date;
    el.calendar.querySelectorAll('.day').forEach(x=>x.classList.toggle('selected',x.dataset.date===state.selectedDate));
    openDayList(cell.dataset.date);
  }));
  el.calendar.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();state.selectedDate=b.dataset.add;renderCalendar();newEvent(b.dataset.add)}));
  el.calendar.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',async ev=>{ev.stopPropagation();await openEvent(b.dataset.id)}));
}
function openEvent(scheduleId){
  const event=state.events.find(e=>e.scheduleId===scheduleId);
  if(!event){toast('端末に予定詳細がありません。「読込」を押してください。');return;}
  const e={...event,attachments:Array.isArray(event.attachments)?event.attachments:[]};
  state.selectedDate=e.date;
  renderCalendar();
  renderDetail(e);
}
function newEvent(date=todayKey()){
  state.currentEvent=null;$('modalTitle').textContent='予定追加';fillForm({date,type:'練習',categories:[]});showStatus(el.modalStatus,'');setMode('edit');openModal()
}
function editCurrent(){if(!state.currentEvent)return;$('modalTitle').textContent='予定変更';fillForm(state.currentEvent);showStatus(el.modalStatus,'');setMode('edit')}
function copyCurrent(){if(!state.currentEvent)return;const copy={...state.currentEvent,scheduleId:'',sourceRef:'',date:state.currentEvent.date};$('modalTitle').textContent='予定複写';fillForm(copy);showStatus(el.modalStatus,'');setMode('edit')}
function toggleTimes(){$('timeFields').classList.toggle('hidden',$('allDay').checked)}
async function saveEvent(){
  try{
    const categories=selectedCategories();
    if(!categories.length)throw new Error('カテゴリーを1つ以上選択してください。');
    const previousId=$('scheduleId').value;
    const data={
      token:state.token,scheduleId:previousId,sourceRef:$('sourceRef').value,
      date:$('date').value,type:$('type').value,color:normalizeHexColor($('eventColor').value),categories:JSON.stringify(categories),
      title:$('title').value.trim(),location:$('location').value.trim(),
      allDay:$('allDay').checked,startTime:$('startTime').value,endTime:$('endTime').value,
      note:$('note').value.trim(),attendanceEnabled:$('attendanceEnabled').checked,
      deadlineDate:$('deadlineDate').value,deadlineTime:$('deadlineTime').value
    };
    $('saveBtn').disabled=true;showStatus(el.modalStatus,'保存中…');
    const res=assertOk(await jsonp('save',data));
    if(!res.event)throw new Error('保存後の予定データを取得できませんでした。');
    const targetMonth=res.event.date.slice(0,7);
    closeModal();
    await loadMonth(targetMonth,{force:true});
    toast('保存しました。');
  }catch(e){showStatus(el.modalStatus,e.message,'error')}finally{$('saveBtn').disabled=false}
}
async function deleteCurrent(){
  if(!state.currentEvent||!confirm('この予定を削除しますか？'))return;
  try{
    const res=assertOk(await jsonp('delete',{token:state.token,scheduleId:state.currentEvent.scheduleId,sourceRef:state.currentEvent.sourceRef||''}));
    const deletedId=state.currentEvent.scheduleId;closeModal();removeLocalEvent(deletedId);toast('削除しました。');
  }catch(e){toast(e.message)}
}
async function uploadAttachment(){
  const input=$('attachmentInput'),file=input.files&&input.files[0],status=$('uploadStatus');
  if(!state.currentEvent||!state.currentEvent.scheduleId){showStatus(status,'先に予定を保存してください。','error');return}
  if(!file){showStatus(status,'添付するファイルを選択してください。','error');return}
  try{
    const processed=await prepareFile(file);
    const uploadId='up_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    showStatus(status,'アップロード中…');
    await fetch(state.apiUrl,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({
        action:'uploadAttachment',uploadId,token:state.token,scheduleId:state.currentEvent.scheduleId,
        fileName:processed.name,mimeType:processed.type,base64:processed.base64
      })
    });
    const result=await pollUpload(uploadId);
    assertOk(result);
    showStatus(status,'添付しました。','ok');
    const fresh=assertOk(await jsonp('event',{token:state.token,scheduleId:state.currentEvent.scheduleId}));
    saveEventToLocalMonths(fresh.event);
    renderDetail(fresh.event);
  }catch(e){showStatus(status,e.message,'error')}
}
async function prepareFile(file){
  const max=10*1024*1024;
  if(file.size>max)throw new Error('1ファイル10MB以下にしてください。');
  if(file.type.startsWith('image/')){
    const dataUrl=await fileToDataUrl(file);
    const img=await loadImage(dataUrl);
    const maxEdge=1600,scale=Math.min(1,maxEdge/Math.max(img.width,img.height));
    const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    const out=canvas.toDataURL('image/jpeg',0.82);
    return {name:file.name.replace(/\.[^.]+$/,'.jpg'),type:'image/jpeg',base64:out.split(',')[1]};
  }
  const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','application/vnd.ms-excel','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
  if(!allowed.includes(file.type))throw new Error('対応形式は画像、PDF、Word、Excelです。');
  const dataUrl=await fileToDataUrl(file);
  return {name:file.name,type:file.type,base64:dataUrl.split(',')[1]};
}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('ファイルを読み込めませんでした。'));r.readAsDataURL(file)})}
function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('画像を読み込めませんでした。'));i.src=src})}
async function pollUpload(uploadId){
  for(let i=0;i<25;i++){
    await new Promise(r=>setTimeout(r,900));
    const res=await jsonp('uploadStatus',{token:state.token,uploadId});
    if(res.status==='pending')continue;
    return res;
  }
  throw new Error('アップロード確認がタイムアウトしました。');
}

async function openAttachment(id){
  try{
    toast('ファイルを読み込んでいます…');
    const res=assertOk(await jsonp('attachmentContent',{token:state.token,attachmentId:id}));
    const binary=atob(res.base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const blob=new Blob([bytes],{type:res.mimeType||'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const isImage=String(res.mimeType||'').startsWith('image/');
    const isPdf=String(res.mimeType||'')==='application/pdf';

    if(isImage){
      const viewer=document.createElement('div');
      viewer.className='modal open';
      viewer.style.zIndex='120';
      viewer.innerHTML=`<section class="dialog" style="max-width:900px"><div class="dialoghead"><h3>${esc(res.fileName)}</h3><button class="close" type="button">×</button></div><div class="dialogbody" style="display:grid;place-items:center;background:#020617"><img src="${url}" alt="${esc(res.fileName)}" style="max-width:100%;max-height:78dvh;object-fit:contain"></div><div class="dialogfoot"><span class="spacer"></span><button class="btn" type="button" data-download>保存</button><button class="btn" type="button" data-close>閉じる</button></div></section>`;
      document.body.appendChild(viewer);
      const close=()=>{URL.revokeObjectURL(url);viewer.remove()};
      viewer.querySelector('.close').onclick=close;
      viewer.querySelector('[data-close]').onclick=close;
      viewer.querySelector('[data-download]').onclick=()=>downloadBlob(url,res.fileName);
      viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
      return;
    }

    if(isPdf){
      const viewer=document.createElement('div');
      viewer.className='modal open';
      viewer.style.zIndex='120';
      viewer.innerHTML=`<section class="dialog" style="max-width:1000px"><div class="dialoghead"><h3>${esc(res.fileName)}</h3><button class="close" type="button">×</button></div><div class="dialogbody" style="padding:0"><iframe src="${url}" title="${esc(res.fileName)}" style="width:100%;height:78dvh;border:0;background:white"></iframe></div><div class="dialogfoot"><span class="spacer"></span><button class="btn" type="button" data-download>保存</button><button class="btn" type="button" data-close>閉じる</button></div></section>`;
      document.body.appendChild(viewer);
      const close=()=>{URL.revokeObjectURL(url);viewer.remove()};
      viewer.querySelector('.close').onclick=close;
      viewer.querySelector('[data-close]').onclick=close;
      viewer.querySelector('[data-download]').onclick=()=>downloadBlob(url,res.fileName);
      viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
      return;
    }

    downloadBlob(url,res.fileName);
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  }catch(e){toast(e.message)}
}
function downloadBlob(url,fileName){
  const a=document.createElement('a');
  a.href=url;a.download=fileName||'attachment';
  document.body.appendChild(a);a.click();a.remove();
}

async function deleteAttachment(id){
  if(!confirm('この添付を削除しますか？'))return;
  try{
    assertOk(await jsonp('deleteAttachment',{token:state.token,attachmentId:id}));
    const fresh=assertOk(await jsonp('event',{token:state.token,scheduleId:state.currentEvent.scheduleId}));
    saveEventToLocalMonths(fresh.event);renderDetail(fresh.event);toast('添付を削除しました。');
  }catch(e){toast(e.message)}
}
function shiftMonth(diff){const [y,m]=state.month.split('-').map(Number);loadMonth(monthKey(new Date(y,m-1+diff,1)))}
function logout(callApi=true){if(callApi&&state.token)jsonp('logout',{token:state.token}).catch(()=>{});clearSession();el.appView.classList.add('hidden');el.loginView.classList.remove('hidden');el.loginBtn.classList.remove('hidden');el.password.closest('.field').classList.remove('hidden');el.password.value='';showStatus(el.loginStatus,'');showStatus($('lineLoginStatus'),'コーチはパスワードでログインしてください。')}
function enableMonthSwipe(){
  const target=document.querySelector('.calendar-wrap');
  let startX=0,startY=0,tracking=false;
  target.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;tracking=true;
  },{passive:true});
  target.addEventListener('touchend',e=>{
    if(!tracking||!e.changedTouches.length)return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.25)return;
    shiftMonth(dx<0?1:-1);
  },{passive:true});
}
async function init(){
  buildSelectors();enableMonthSwipe();state.selectedDate=todayKey();state.categoryFilter='ALL';el.apiUrl.value=state.apiUrl;$('categoryFilter').value='ALL';
  el.loginBtn.onclick=login;$('newBtn').onclick=()=>newEvent();$('categoryFilter').onchange=()=>{state.categoryFilter=$('categoryFilter').value||'ALL';renderCalendar()};$('prevBtn').onclick=()=>shiftMonth(-1);$('nextBtn').onclick=()=>shiftMonth(1);$('todayBtn').onclick=()=>loadMonth(monthKey(new Date()));
  $('sheetBtn').onclick=manualRefreshMonth;$('logoutBtn').onclick=()=>logout(true);
  $('closeBtn').onclick=closeModal;$('closeDetailBtn').onclick=closeModal;$('editBtn').onclick=editCurrent;$('copyBtn').onclick=copyCurrent;$('deleteBtn').onclick=deleteCurrent;
  $('cancelEditBtn').onclick=()=>state.currentEvent?renderDetail(state.currentEvent):closeModal();$('saveBtn').onclick=saveEvent;$('allDay').onchange=toggleTimes;
  $('attendanceEnabled').onchange=toggleDeadline;
  el.modal.addEventListener('click',e=>{if(e.target===el.modal)closeModal()});
  $('dayListClose').onclick=closeDayList;
  $('dayListCloseBtn').onclick=closeDayList;
  $('dayListModal').addEventListener('click',e=>{if(e.target===$('dayListModal'))closeDayList()});

  // コーチ専用ページ。LINE選手認証は実行しない。
  await initCoachLogin();

  if('caches' in window){
    try{
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k!=='ninja-schedule-v9-5').map(k=>caches.delete(k)));
    }catch(e){}
  }
  if('serviceWorker' in navigator){
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?v=9.5.0');
      reg.update().catch(()=>{});
    }catch(e){}
  }
}
init();
</script>
