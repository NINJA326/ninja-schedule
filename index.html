<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>NINJA AIRS 練習予定表 選手版</title>

  <style>
    :root{
      --bg:#07111f;
      --panel:#0f1d31;
      --panel-2:#14263e;
      --line:#29415f;
      --text:#f8fafc;
      --muted:#a9b8cb;
      --primary:#2563eb;
      --danger:#dc2626;
      --success:#16a34a;
      --shadow:0 14px 35px rgba(0,0,0,.30);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,select,textarea,input{font:inherit}
    button{touch-action:manipulation}
    .hidden{display:none!important}

    .screen{
      min-height:100dvh;
      padding:
        calc(16px + env(safe-area-inset-top))
        12px
        calc(16px + env(safe-area-inset-bottom));
    }

    .boot{
      display:grid;
      place-items:center;
    }

    .boot-card{
      width:min(430px,100%);
      padding:28px 22px;
      text-align:center;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
    }

    .boot-card h1{
      margin:0 0 8px;
      font-size:30px;
      letter-spacing:.04em;
    }

    .boot-card p{
      margin:0 0 14px;
      color:var(--muted);
    }

    .status{
      min-height:20px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .status.error{color:#fecaca}
    .status.ok{color:#bbf7d0}

    .btn{
      min-height:42px;
      border:1px solid var(--line);
      border-radius:10px;
      padding:9px 12px;
      background:var(--panel-2);
      color:var(--text);
      font-weight:800;
      cursor:pointer;
    }

    .btn.primary{
      background:var(--primary);
      border-color:var(--primary);
    }

    .btn.danger{
      background:var(--danger);
      border-color:var(--danger);
    }

    .app{
      width:min(1180px,100%);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      padding:12px;
      background:rgba(7,17,31,.96);
      border:1px solid var(--line);
      border-radius:14px;
    }

    .brand h1{
      margin:0;
      font-size:18px;
    }

    .brand .player{
      margin-top:4px;
      color:#bfdbfe;
      font-size:12px;
    }

    .brand .build{
      margin-top:3px;
      color:#64748b;
      font-size:10px;
    }

    .toolbar{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:6px;
    }

    .nav{
      display:flex;
      gap:5px;
      align-items:center;
    }

    .month-title{
      margin:0;
      text-align:center;
      font-size:20px;
    }

    .category-select{
      min-width:120px;
      max-width:150px;
      min-height:42px;
      padding:8px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--panel-2);
      color:var(--text);
      font-weight:700;
    }

    .calendar{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      grid-template-rows:30px repeat(6,minmax(88px,1fr));
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:var(--panel);
    }

    .dow{
      display:grid;
      place-items:center;
      border-right:1px solid var(--line);
      background:#0a1627;
      font-size:12px;
      font-weight:900;
    }

    .dow:nth-child(7){border-right:0}
    .dow.sun{color:#fca5a5}
    .dow.sat{color:#93c5fd}

    .day{
      min-width:0;
      padding:4px;
      border-top:1px solid var(--line);
      border-right:1px solid var(--line);
      overflow:hidden;
      background:var(--panel);
    }

    .day:nth-child(7n){border-right:0}
    .day.out{opacity:.32}
    .day.today{box-shadow:inset 0 0 0 2px #60a5fa}

    .day-number{
      display:block;
      margin-bottom:3px;
      font-size:11px;
      font-weight:900;
    }

    .event{
      display:block;
      width:100%;
      margin:2px 0;
      padding:3px 4px;
      border:0;
      border-radius:5px;
      color:#fff;
      text-align:left;
      font-size:9px;
      font-weight:800;
      line-height:1.2;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      cursor:pointer;
    }

    .more{
      padding-left:2px;
      color:var(--muted);
      font-size:9px;
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,.72);
    }

    .modal.open{display:flex}

    .dialog{
      width:min(680px,100%);
      max-height:92dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px 20px 0 0;
      box-shadow:var(--shadow);
    }

    .dialog-head,
    .dialog-foot{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:13px 15px;
      border-bottom:1px solid var(--line);
    }

    .dialog-foot{
      border-top:1px solid var(--line);
      border-bottom:0;
      padding-bottom:calc(13px + env(safe-area-inset-bottom));
    }

    .dialog-head h2{
      margin:0;
      font-size:18px;
    }

    .dialog-body{
      flex:1 1 auto;
      overflow:auto;
      padding:15px;
    }

    .detail{
      display:grid;
      grid-template-columns:100px 1fr;
      gap:11px;
      margin:0;
      font-size:14px;
    }

    .detail dt{
      color:var(--muted);
      font-weight:900;
    }

    .detail dd{
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .attendance{
      margin-top:18px;
      padding:13px;
      border:1px solid var(--line);
      border-radius:13px;
      background:#09182a;
    }

    .attendance h3{
      margin:0 0 9px;
      font-size:16px;
    }

    .attendance-buttons{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:7px;
      margin-top:10px;
    }

    .field{
      display:grid;
      gap:6px;
      margin-top:10px;
    }

    .field label{
      color:var(--muted);
      font-size:12px;
      font-weight:900;
    }

    .field input,
    .field textarea{
      width:100%;
      min-height:44px;
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px;
      background:#071425;
      color:var(--text);
    }

    .field textarea{
      min-height:84px;
      resize:vertical;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:26px;
      z-index:100;
      display:none;
      transform:translateX(-50%);
      padding:11px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#020617;
      color:#fff;
      box-shadow:var(--shadow);
    }

    .toast.show{display:block}

    @media(max-width:760px){
      .screen{padding-left:6px;padding-right:6px}
      .topbar{border-radius:0;padding:8px 6px}
      .brand h1{font-size:16px}
      .toolbar{grid-template-columns:auto 1fr auto}
      .month-title{font-size:18px}
      .btn{min-height:38px;padding:7px 9px}
      .category-select{min-height:38px;min-width:112px}
      .calendar{
        grid-template-rows:28px repeat(6,minmax(74px,1fr));
      }
      .day{padding:2px}
      .event{font-size:8px;padding:2px 3px}
    }
  </style>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <section id="bootView" class="screen boot">
    <div class="boot-card">
      <h1>NINJA AIRS</h1>
      <p id="bootMessage">LINE選手認証を確認しています…</p>
      <div id="bootStatus" class="status"></div>
      <button id="retryBtn" type="button" class="btn primary hidden" style="width:100%;margin-top:14px">再試行</button>
    </div>
  </section>

  <main id="appView" class="screen hidden">
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>NINJA AIRS 練習予定表</h1>
          <div id="playerInfo" class="player"></div>
          <div class="build">build v10.0-clean-player</div>
        </div>
        <button id="logoutBtn" class="btn" type="button">退出</button>
      </header>

      <section class="toolbar" aria-label="カレンダー操作">
        <div class="nav">
          <button id="prevBtn" class="btn" type="button">‹</button>
          <button id="todayBtn" class="btn" type="button">今日</button>
        </div>
        <h2 id="monthTitle" class="month-title">--</h2>
        <div class="nav">
          <select id="categoryFilter" class="category-select" aria-label="カテゴリー">
            <option value="ALL">全カテゴリー</option>
            <option value="男子U13">男子U13</option>
            <option value="男子U14">男子U14</option>
            <option value="男子U15">男子U15</option>
            <option value="女子U13">女子U13</option>
            <option value="女子U14">女子U14</option>
            <option value="女子U15">女子U15</option>
          </select>
          <button id="nextBtn" class="btn" type="button">›</button>
        </div>
      </section>

      <div id="appStatus" class="status"></div>
      <section id="calendar" class="calendar" aria-label="月間カレンダー"></section>
    </div>
  </main>

  <div id="detailModal" class="modal" aria-hidden="true">
    <section class="dialog">
      <header class="dialog-head">
        <h2>予定詳細</h2>
        <button id="closeModalBtn" class="btn" type="button">閉じる</button>
      </header>
      <div id="detailBody" class="dialog-body"></div>
      <footer class="dialog-foot">
        <span></span>
        <button id="closeModalBottomBtn" class="btn" type="button">閉じる</button>
      </footer>
    </section>
  </div>

  <div id="toast" class="toast"></div>

<script>
'use strict';

const CONFIG = Object.freeze({
  API_URL:
    'https://script.google.com/macros/s/AKfycbx_SBI38cJqdYtnIyeicdnpnTMu4wG67pak-tR3JwqyLHNoyUGxQ_NulmCJsxLF9_Q/exec',
  LIFF_ID_FALLBACK: '2010789200-Iyp3vKNa',
  TOKEN_STORAGE_KEY: 'ninjaSchedulePlayerTokenV10',
  PLAYER_STORAGE_KEY: 'ninjaSchedulePlayerInfoV10',
  EXPIRES_STORAGE_KEY: 'ninjaSchedulePlayerExpiresV10',
  LIFF_STORAGE_KEY: 'ninjaScheduleLiffIdV10',
  MONTH_CACHE_PREFIX: 'ninjaScheduleMonthV10:',
  DEFAULT_TOKEN_SECONDS: 21600
});

const state = {
  token: localStorage.getItem(CONFIG.TOKEN_STORAGE_KEY) || '',
  player: readJson(CONFIG.PLAYER_STORAGE_KEY),
  expiresAt: Number(localStorage.getItem(CONFIG.EXPIRES_STORAGE_KEY) || 0),
  liffId: localStorage.getItem(CONFIG.LIFF_STORAGE_KEY) || '',
  month: '',
  events: [],
  selectedEvent: null,
  categoryFilter: 'ALL',
  loading: false
};

const $ = id => document.getElementById(id);

function readJson(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(error){
    return null;
  }
}

function showStatus(target, message, type=''){
  target.textContent = message || '';
  target.className = 'status' + (type ? ' ' + type : '');
}

function toast(message){
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  setTimeout(() => node.classList.remove('show'), 2200);
}

function wait(milliseconds){
  return new Promise(resolve => setTimeout(resolve, milliseconds));
}

function jsonpOnce(action, params={}, timeoutMs=25000){
  return new Promise((resolve, reject) => {
    const callbackName =
      'ninjaCallback_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2);

    const script = document.createElement('script');
    let settled = false;

    const timer = setTimeout(() => {
      finish(new Error('通信がタイムアウトしました。'));
    }, timeoutMs);

    function finish(error, data){
      if(settled) return;
      settled = true;
      clearTimeout(timer);

      try{
        delete window[callbackName];
      }catch(deleteError){
        window[callbackName] = undefined;
      }

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

      error ? reject(error) : resolve(data);
    }

    window[callbackName] = data => finish(null, data);

    const query = new URLSearchParams({
      ...params,
      action,
      callback: callbackName,
      _: Date.now()
    });

    script.async = true;
    script.referrerPolicy = 'no-referrer';
    script.onerror = () => {
      finish(new Error('Apps Scriptへ接続できません。'));
    };
    script.src =
      CONFIG.API_URL +
      '?' +
      query.toString();

    document.body.appendChild(script);
  });
}

async function api(action, params={}, timeoutMs=25000){
  const delays = [800, 1800];
  let lastError = null;

  for(let attempt = 0; attempt < 3; attempt++){
    try{
      const response = await jsonpOnce(action, params, timeoutMs);
      return assertSuccess(response);
    }catch(error){
      lastError = error;
      if(attempt < 2){
        await wait(delays[attempt]);
      }
    }
  }

  throw lastError || new Error('通信に失敗しました。');
}

function assertSuccess(response){
  const payload =
    response && typeof response === 'object'
      ? response
      : {};

  const ok =
    payload.success === true ||
    payload.ok === true ||
    payload.status === 'ok';

  if(!ok){
    throw new Error(
      payload.message ||
      '処理に失敗しました。'
    );
  }

  return payload.data !== undefined
    ? payload.data
    : payload;
}

function monthKey(date){
  return (
    date.getFullYear() +
    '-' +
    String(date.getMonth() + 1).padStart(2, '0')
  );
}

function dateKey(date){
  return (
    date.getFullYear() +
    '-' +
    String(date.getMonth() + 1).padStart(2, '0') +
    '-' +
    String(date.getDate()).padStart(2, '0')
  );
}

function parseCategories(value){
  if(Array.isArray(value)){
    return value
      .map(item => normalizeCategory(item))
      .filter(Boolean);
  }

  return String(value || '')
    .split(/[\/,、|]/)
    .map(item => normalizeCategory(item))
    .filter(Boolean);
}

function normalizeCategory(value){
  const text = String(value || '').trim();

  const map = {
    'U13男子':'男子U13',
    'U14男子':'男子U14',
    'U15男子':'男子U15',
    'U13女子':'女子U13',
    'U14女子':'女子U14',
    'U15女子':'女子U15'
  };

  return map[text] || text;
}

function normalizeEventList(payload){
  if(Array.isArray(payload)) return payload;
  if(Array.isArray(payload?.events)) return payload.events;
  if(Array.isArray(payload?.schedules)) return payload.schedules;
  if(Array.isArray(payload?.items)) return payload.items;
  return [];
}

function normalizeEvent(payload){
  if(!payload || typeof payload !== 'object') return null;
  if(payload.schedule) return payload.schedule;
  if(payload.event) return payload.event;
  if(payload.item) return payload.item;
  return payload;
}

function escapeHtml(value){
  return String(value ?? '').replace(
    /[&<>"']/g,
    character => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[character])
  );
}

function colorFor(event){
  const configured = String(event.color || '').trim();
  if(/^#[0-9a-fA-F]{6}$/.test(configured)){
    return configured;
  }

  const map = {
    '練習':'#2563eb',
    '試合':'#dc2626',
    '遠征':'#16a34a',
    'OFF':'#6b7280',
    '特別練習':'#ea580c',
    'シューティング':'#0891b2'
  };

  return map[event.type] || '#7c3aed';
}

function hasValidSavedSession(){
  if(!state.token || !state.player) return false;

  if(
    state.expiresAt &&
    Date.now() >= state.expiresAt
  ){
    clearSession();
    return false;
  }

  return true;
}

function saveSession(result){
  const expiresIn =
    Math.max(
      60,
      Number(result.expiresIn) ||
      CONFIG.DEFAULT_TOKEN_SECONDS
    );

  state.token = String(result.token || '').trim();
  state.player = result.player || null;
  state.expiresAt =
    Date.now() +
    expiresIn * 1000 -
    30000;

  localStorage.setItem(
    CONFIG.TOKEN_STORAGE_KEY,
    state.token
  );

  localStorage.setItem(
    CONFIG.PLAYER_STORAGE_KEY,
    JSON.stringify(state.player || {})
  );

  localStorage.setItem(
    CONFIG.EXPIRES_STORAGE_KEY,
    String(state.expiresAt)
  );
}

function clearSession(){
  state.token = '';
  state.player = null;
  state.expiresAt = 0;

  localStorage.removeItem(
    CONFIG.TOKEN_STORAGE_KEY
  );

  localStorage.removeItem(
    CONFIG.PLAYER_STORAGE_KEY
  );

  localStorage.removeItem(
    CONFIG.EXPIRES_STORAGE_KEY
  );
}

function showApp(){
  $('bootView').classList.add('hidden');
  $('appView').classList.remove('hidden');

  $('playerInfo').textContent =
    (state.player?.playerName ||
      state.player?.name ||
      '選手') +
    ' / ' +
    (normalizeCategory(
      state.player?.category || ''
    ));
}

function showBootError(message){
  $('bootMessage').textContent =
    '予定表を開けませんでした';

  showStatus(
    $('bootStatus'),
    message,
    'error'
  );

  $('retryBtn').classList.remove('hidden');
}

async function authenticate(){
  try{
    $('retryBtn').classList.add('hidden');
    $('bootMessage').textContent =
      'LINE選手認証を確認しています…';

    showStatus(
      $('bootStatus'),
      '認証情報を確認しています…'
    );

    if(!state.liffId){
      try{
        const publicConfig =
          await api(
            'publicConfig',
            {},
            18000
          );

        state.liffId =
          String(
            publicConfig.liffId || ''
          ).trim();
      }catch(error){
        state.liffId =
          CONFIG.LIFF_ID_FALLBACK;
      }

      if(state.liffId){
        localStorage.setItem(
          CONFIG.LIFF_STORAGE_KEY,
          state.liffId
        );
      }
    }

    if(!state.liffId){
      throw new Error(
        'LIFF IDを確認できません。'
      );
    }

    showStatus(
      $('bootStatus'),
      'LINEログインを確認しています…'
    );

    await liff.init({
      liffId: state.liffId,
      withLoginOnExternalBrowser: true
    });

    if(!liff.isLoggedIn()){
      liff.login({
        redirectUri:
          location.origin +
          location.pathname +
          '?v=1001'
      });
      return;
    }

    const idToken = liff.getIDToken();

    if(!idToken){
      throw new Error(
        'LINE認証情報を取得できません。'
      );
    }

    showStatus(
      $('bootStatus'),
      '選手情報を確認しています…'
    );

    const loginResult =
      await api(
        'lineLogin',
        {idToken},
        45000
      );

    if(
      String(loginResult.role || '') !==
      'player'
    ){
      throw new Error(
        '選手アカウントとして認証できませんでした。'
      );
    }

    saveSession(loginResult);
    showApp();

    loadMonth(
      monthKey(new Date())
    ).catch(error => {
      showStatus(
        $('appStatus'),
        error.message,
        'error'
      );
    });

  }catch(error){
    showBootError(
      error.message ||
      '認証に失敗しました。'
    );
  }
}

async function initLogin(){
  if(hasValidSavedSession()){
    showApp();

    loadMonth(
      monthKey(new Date())
    ).catch(async error => {
      if(
        /ログイン|有効期限|認証/.test(
          error.message || ''
        )
      ){
        clearSession();
        $('appView').classList.add('hidden');
        $('bootView').classList.remove('hidden');
        await authenticate();
      }else{
        showStatus(
          $('appStatus'),
          error.message,
          'error'
        );
      }
    });

    return;
  }

  await authenticate();
}

function monthCacheKey(month){
  return (
    CONFIG.MONTH_CACHE_PREFIX +
    month
  );
}

function readMonthCache(month){
  try{
    const raw =
      localStorage.getItem(
        monthCacheKey(month)
      );

    if(!raw) return null;

    const parsed = JSON.parse(raw);

    return Array.isArray(parsed.events)
      ? parsed
      : null;

  }catch(error){
    return null;
  }
}

function writeMonthCache(month, events){
  try{
    localStorage.setItem(
      monthCacheKey(month),
      JSON.stringify({
        savedAt: Date.now(),
        events
      })
    );
  }catch(error){}
}

async function loadMonth(month){
  state.month = month;

  const cached =
    readMonthCache(month);

  state.events =
    cached?.events || [];

  renderCalendar();

  if(cached){
    showStatus(
      $('appStatus'),
      '保存済み予定を表示し、最新情報を確認しています。',
      'ok'
    );
  }else{
    showStatus(
      $('appStatus'),
      '予定を読み込んでいます…'
    );
  }

  const [year, monthNumber] =
    month.split('-').map(Number);

  const payload =
    await api(
      'schedule.getByMonth',
      {
        token: state.token,
        year,
        month: monthNumber
      },
      30000
    );

  state.events =
    normalizeEventList(payload)
      .sort((a,b) =>
        String(a.date || '').localeCompare(
          String(b.date || '')
        ) ||
        String(a.startTime || '').localeCompare(
          String(b.startTime || '')
        )
      );

  writeMonthCache(
    month,
    state.events
  );

  renderCalendar();

  showStatus(
    $('appStatus'),
    month.replace('-', '年') +
    '月を読み込みました。',
    'ok'
  );
}

function filteredEvents(date){
  return state.events.filter(event => {
    if(
      String(event.date || '') !==
      date
    ){
      return false;
    }

    if(
      state.categoryFilter === 'ALL'
    ){
      return true;
    }

    return parseCategories(
      event.categories ||
      event.category
    ).includes(
      state.categoryFilter
    );
  });
}

function renderCalendar(){
  const [year, monthNumber] =
    state.month.split('-').map(Number);

  if(!year || !monthNumber) return;

  $('monthTitle').textContent =
    year +
    '年' +
    String(monthNumber).padStart(2,'0') +
    '月';

  const first =
    new Date(year, monthNumber - 1, 1);

  const start =
    new Date(
      year,
      monthNumber - 1,
      1 - first.getDay()
    );

  let html =
    ['日','月','火','水','木','金','土']
      .map((label,index) =>
        `<div class="dow ${
          index === 0
            ? 'sun'
            : index === 6
              ? 'sat'
              : ''
        }">${label}</div>`
      )
      .join('');

  const today = dateKey(new Date());

  for(let index = 0; index < 42; index++){
    const date = new Date(start);
    date.setDate(
      start.getDate() + index
    );

    const key = dateKey(date);
    const events = filteredEvents(key);
    const isOutside =
      date.getMonth() !==
      monthNumber - 1;

    html += `
      <div class="day ${
        isOutside ? 'out' : ''
      } ${
        key === today ? 'today' : ''
      }">
        <span class="day-number">
          ${date.getDate()}
        </span>

        ${events.slice(0,4)
          .map(event => `
            <button
              type="button"
              class="event"
              data-event-id="${escapeHtml(event.scheduleId || '')}"
              style="background:${colorFor(event)}"
              title="${escapeHtml(event.title || event.type || '予定')}"
            >
              ${escapeHtml(
                [
                  event.title ||
                  event.type ||
                  '予定',
                  event.allDay
                    ? '終日'
                    : String(
                        event.startTime || ''
                      ).slice(0,5)
                ].filter(Boolean).join(' ')
              )}
            </button>
          `)
          .join('')}

        ${
          events.length > 4
            ? `<div class="more">＋${events.length - 4}件</div>`
            : ''
        }
      </div>
    `;
  }

  $('calendar').innerHTML = html;

  $('calendar')
    .querySelectorAll('[data-event-id]')
    .forEach(button => {
      button.addEventListener(
        'click',
        () => openEvent(
          button.dataset.eventId
        )
      );
    });
}

async function openEvent(scheduleId){
  try{
    showStatus(
      $('appStatus'),
      '予定詳細を読み込んでいます…'
    );

    const payload =
      await api(
        'schedule.getById',
        {
          token: state.token,
          scheduleId
        },
        30000
      );

    const event =
      normalizeEvent(payload);

    if(!event){
      throw new Error(
        '予定詳細を取得できませんでした。'
      );
    }

    state.selectedEvent = event;
    renderEventDetail(event);

    $('detailModal').classList.add('open');
    $('detailModal').setAttribute(
      'aria-hidden',
      'false'
    );

    showStatus(
      $('appStatus'),
      '',
      ''
    );

  }catch(error){
    toast(error.message);
  }
}

function renderEventDetail(event){
  const categories =
    parseCategories(
      event.categories ||
      event.category
    ).join(' / ');

  const time =
    event.allDay
      ? '終日'
      : [
          event.startTime,
          event.endTime
        ]
          .filter(Boolean)
          .join('〜') ||
        '時間未設定';

  $('detailBody').innerHTML = `
    <dl class="detail">
      <dt>カテゴリー</dt>
      <dd>${escapeHtml(categories)}</dd>

      <dt>種類</dt>
      <dd>${escapeHtml(event.type || '')}</dd>

      <dt>日付</dt>
      <dd>${escapeHtml(event.date || '')}</dd>

      <dt>時間</dt>
      <dd>${escapeHtml(time)}</dd>

      <dt>予定名</dt>
      <dd>${escapeHtml(event.title || '')}</dd>

      <dt>会場</dt>
      <dd>${escapeHtml(event.location || '')}</dd>

      <dt>詳細</dt>
      <dd>${escapeHtml(event.note || '')}</dd>
    </dl>

    ${
      event.attendanceEnabled
        ? renderAttendance(event)
        : ''
    }
  `;

  bindAttendance();
}

function renderAttendance(event){
  const current =
    event.myAttendance || {};

  return `
    <section class="attendance">
      <h3>出欠回答</h3>

      <div class="status">
        回答期限：
        ${escapeHtml(
          event.deadlineAt ||
          '設定なし'
        )}
      </div>

      <div class="attendance-buttons">
        <button
          type="button"
          class="btn"
          data-attendance="出席"
        >出席</button>

        <button
          type="button"
          class="btn"
          data-attendance="遅刻"
        >遅刻</button>

        <button
          type="button"
          class="btn"
          data-attendance="欠席"
        >欠席</button>
      </div>

      <div id="attendanceForm"></div>

      <div id="attendanceStatus" class="status">
        ${
          current.status
            ? '現在の回答：' +
              escapeHtml(current.status)
            : 'まだ回答していません。'
        }
      </div>
    </section>
  `;
}

function bindAttendance(){
  document
    .querySelectorAll(
      '[data-attendance]'
    )
    .forEach(button => {
      button.addEventListener(
        'click',
        () => showAttendanceForm(
          button.dataset.attendance
        )
      );
    });
}

function showAttendanceForm(status){
  const container =
    $('attendanceForm');

  if(status === '出席'){
    container.innerHTML = `
      <button
        id="saveAttendanceBtn"
        type="button"
        class="btn primary"
        style="width:100%;margin-top:10px"
      >出席で登録</button>
    `;
  }else if(status === '遅刻'){
    container.innerHTML = `
      <div class="field">
        <label>到着予定時刻 *</label>
        <input id="arrivalTime" type="time">
      </div>

      <div class="field">
        <label>遅刻理由 *</label>
        <textarea id="attendanceReason"></textarea>
      </div>

      <button
        id="saveAttendanceBtn"
        type="button"
        class="btn primary"
        style="width:100%;margin-top:10px"
      >遅刻で登録</button>
    `;
  }else{
    container.innerHTML = `
      <div class="field">
        <label>欠席理由 *</label>
        <textarea id="attendanceReason"></textarea>
      </div>

      <button
        id="saveAttendanceBtn"
        type="button"
        class="btn primary"
        style="width:100%;margin-top:10px"
      >欠席で登録</button>
    `;
  }

  $('saveAttendanceBtn').onclick =
    () => saveAttendance(status);
}

async function saveAttendance(status){
  try{
    const event =
      state.selectedEvent;

    if(!event?.scheduleId){
      throw new Error(
        '予定情報を確認できません。'
      );
    }

    const arrivalTime =
      $('arrivalTime')?.value || '';

    const reason =
      $('attendanceReason')
        ?.value
        ?.trim() || '';

    if(
      status === '遅刻' &&
      !arrivalTime
    ){
      throw new Error(
        '到着予定時刻を入力してください。'
      );
    }

    if(
      (status === '遅刻' ||
       status === '欠席') &&
      !reason
    ){
      throw new Error(
        status +
        '理由を入力してください。'
      );
    }

    showStatus(
      $('attendanceStatus'),
      '登録中…'
    );

    const result =
      await api(
        'attendance.save',
        {
          token: state.token,
          scheduleId: event.scheduleId,
          status,
          arrivalTime,
          reason
        },
        45000
      );

    state.selectedEvent = {
      ...event,
      myAttendance:
        result.attendance ||
        result.item ||
        result
    };

    showStatus(
      $('attendanceStatus'),
      status +
      'で登録しました。',
      'ok'
    );

    toast('出欠を登録しました。');

  }catch(error){
    showStatus(
      $('attendanceStatus'),
      error.message,
      'error'
    );
  }
}

function closeModal(){
  $('detailModal').classList.remove('open');
  $('detailModal').setAttribute(
    'aria-hidden',
    'true'
  );
  state.selectedEvent = null;
}

function shiftMonth(offset){
  const [year, monthNumber] =
    state.month.split('-').map(Number);

  loadMonth(
    monthKey(
      new Date(
        year,
        monthNumber - 1 + offset,
        1
      )
    )
  ).catch(error => {
    showStatus(
      $('appStatus'),
      error.message,
      'error'
    );
  });
}

async function logout(){
  const token = state.token;
  clearSession();

  if(token){
    api(
      'logout',
      {token},
      10000
    ).catch(() => {});
  }

  try{
    if(
      typeof liff !== 'undefined' &&
      liff.isLoggedIn()
    ){
      liff.logout();
    }
  }catch(error){}

  location.replace(
    location.origin +
    location.pathname +
    '?v=1001'
  );
}

function bindEvents(){
  $('retryBtn').onclick = authenticate;
  $('logoutBtn').onclick = logout;
  $('prevBtn').onclick = () => shiftMonth(-1);
  $('nextBtn').onclick = () => shiftMonth(1);
  $('todayBtn').onclick = () =>
    loadMonth(
      monthKey(new Date())
    ).catch(error => {
      showStatus(
        $('appStatus'),
        error.message,
        'error'
      );
    });

  $('categoryFilter').onchange = () => {
    state.categoryFilter =
      $('categoryFilter').value;
    renderCalendar();
  };

  $('closeModalBtn').onclick =
    closeModal;

  $('closeModalBottomBtn').onclick =
    closeModal;

  $('detailModal').addEventListener(
    'click',
    event => {
      if(event.target === $('detailModal')){
        closeModal();
      }
    }
  );
}

async function init(){
  bindEvents();
  state.categoryFilter = 'ALL';
  $('categoryFilter').value = 'ALL';
  await initLogin();
}

init();
</script>
